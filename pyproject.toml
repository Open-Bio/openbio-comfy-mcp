[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openbio-comfy-mcp"
description = "Let an AI inspect, edit, and queue the workflow currently open on your ComfyUI canvas. After install, add npx -y openbio-comfy-mcp@latest to Cursor, Codex, or Claude."
version = "0.1.2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["comfyui", "mcp", "model-context-protocol", "openbio"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Open-Bio/openbio-comfy-mcp"
Repository = "https://github.com/Open-Bio/openbio-comfy-mcp"
Documentation = "https://github.com/Open-Bio/openbio-comfy-mcp#readme"
Issues = "https://github.com/Open-Bio/openbio-comfy-mcp/issues"

[tool.comfy]
PublisherId = "open-bio"
DisplayName = "OpenBio Comfy MCP"
Icon = "https://raw.githubusercontent.com/Open-Bio/openbio-comfy-mcp/main/media/icon.png"
Banner = "https://raw.githubusercontent.com/Open-Bio/openbio-comfy-mcp/main/media/banner.png"
requires-comfyui = ">=0.33.0"
web = "web"
includes = ["dist"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = [".", "../ComfyUI"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["openbio_comfy_mcp*"]
